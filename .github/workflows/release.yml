name: publish-release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: release-wheels-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test platform wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate release artifact set
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = sorted(Path("dist").iterdir())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          if len(wheels) != 24 or len(sdists) != 1:
              raise SystemExit(
                  f"expected 24 wheels and 1 sdist, got {len(wheels)} wheels and {len(sdists)} sdists"
              )

          with tarfile.open(sdists[0]) as archive:
              pkg_info = next(member for member in archive.getmembers() if member.name.endswith("/PKG-INFO"))
              metadata = email.message_from_binary_file(archive.extractfile(pkg_info))
          version = metadata["Version"]
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match package version {version!r}"
              )
          print(f"validated {len(artifacts)} artifacts for {expected_tag}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

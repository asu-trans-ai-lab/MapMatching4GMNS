name: self-demo
on: [push, pull_request]
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e ".[full,dev]"
      - name: Build native engine (Engine 1) — optional
        run: |
          pip install pybind11
          cd native && bash build_pybind.sh || echo "native build skipped; geometric-only"
      - name: Run all self-demo cases (synthetic, i95 trip/CV, TMC)
        env:
          MAPMATCHING4GMNS_ENGINE_DIR: ${{ github.workspace }}/native
        run: python -m mapmatching4gmns.selfdemo --all   # exits non-zero if any case fails
      - name: pytest
        run: pytest -q
